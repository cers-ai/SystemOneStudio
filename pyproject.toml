[project]
name = "systemone-studio-workspace"
version = "0.1.0"
description = "SystemOneStudio - zero-code decision model training platform. Workspace root."
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
# libs/ is listed explicitly rather than globbed: it also holds TypeScript
# workspaces (libs/ui-terminology) which have no pyproject.toml.
members = [
  "apps/api",
  "libs/contracts",
  "libs/db",
  "libs/model-registry",
  "services/*",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

# ---------------------------------------------------------------------------
# Tool configuration lives ONLY here. Always run tools from the repo root so
# this file is the single source of truth for lint / typecheck / test.
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps", "libs", "services"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # FastAPI Depends() in defaults is idiomatic
  "N818",    # exception names may deviate from Error suffix in domain code
  "RUF012",  # ClassVar annotations on pydantic models are noisy
  # The product surface is Chinese by design (需求方案.txt principle 4: users
  # read business language, not technical terms), so fullwidth punctuation in
  # prompts, fixtures and user-facing strings is intentional, not a typo.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["son_api", "son_contracts", "son_model_registry"]

[tool.mypy]
python_version = "3.11"
# Each service and lib uses a src layout, so mypy needs every src dir on the
# path to resolve `son_api`, `son_contracts`, ... as top-level modules.
mypy_path = [
  "apps/api/src",
  "libs/contracts/src",
  "libs/db/src",
  "libs/model-registry/src",
  "services/data-pipeline/src",
  "services/evaluator/src",
  "services/inference/src",
  "services/jev-adapter/src",
  "services/assistant/src",
  "services/orchestrator/src",
  "services/quantizer/src",
  "services/synth/src",
  "services/trainer/src",
  "services/worker/src",
]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

# Third-party libraries without type stubs. `warn_unused_configs` is on, so an
# override for a library that is not yet imported fails the typecheck; add the
# entry here in the same change that introduces the import.
[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*"]
ignore_missing_imports = true

# GPU training / inference stack. Installed only in deploy/gpu/Dockerfile.gpu, so
# the control-plane virtualenv cannot see it and mypy would fail the whole
# typecheck. The GPU modules are the ones that actually use these; everything
# else is checked strictly.
[[tool.mypy.overrides]]
module = [
  "torch.*",
  "transformers.*",
  "peft.*",
  "trl.*",
  "datasets.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "apps/api/tests",
  "libs/contracts/tests",
  "libs/db/tests",
  "libs/model-registry/tests",
  "services/orchestrator/tests",
  "services/data-pipeline/tests",
  "services/synth/tests",
  "services/trainer/tests",
  "services/worker/tests",
  "services/quantizer/tests",
  "services/evaluator/tests",
  "services/inference/tests",
  "services/jev-adapter/tests",
  "services/assistant/tests",
]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
