function renderHome(){view='home';$('workspaceShell').classList.add('hidden');$('homeShell').classList.remove('hidden');const examples=[['quality',presetState('quality')],['ticket',presetState('ticket')],['contract',presetState('contract')]];const current=s.scene?galleryCard(s,{sample:false}):'';const cards=[current,...examples.map(([kind,st])=>galleryCard(st,{sample:true,kind}))].filter(Boolean).join('');$('homeShell').innerHTML=`<section class="home-hero"><span class="eyebrow">SYSTEMONE STUDIO · DECISION MODEL FACTORY</span><h1>从业务样本，训练可直接进入软件流程的判断模型。</h1><p>不做通用小语言模型。聚焦 Jev-style typed decision：输入业务状态，在预定义答案空间内直接给出选择与概率，并通过校准阈值决定自动执行还是转人工。</p><div class="actions"><button class="primary" onclick="newProject()">＋ 新建判断场景</button>${s.scene?'<button onclick="openCurrentProject()">继续当前项目 →</button>':'<button onclick="loadPreset(\'quality\')">打开示例项目 →</button>'}</div><div class="hero-kpis"><span>Choice 型判断 · MVP</span><span>候选答案概率分布</span><span>监督决策训练 + Calibration</span><span>可选 RLCD-like 强化</span></div></section><div class="gallery-head"><div><span class="eyebrow">PROJECT GALLERY</span><h2 style="margin-top:6px">判断场景项目</h2><p>每个项目沉淀自己的 Decision Schema、训练数据、训练配方、校准参数、模型版本和阈值策略。</p></div><div class="gallery-tools"><input aria-label="搜索项目" placeholder="搜索判断场景…" value="${esc(galleryQuery)}" oninput="galleryQuery=this.value;renderHome()"><div class="filter-row"><button class="small ${galleryFilter==='all'?'active':''}" onclick="setGalleryFilter('all')">全部</button><button class="small ${galleryFilter==='active'?'active':''}" onclick="setGalleryFilter('active')">进行中</button><button class="small ${galleryFilter==='done'?'active':''}" onclick="setGalleryFilter('done')">已完成</button><button class="small ${galleryFilter==='sample'?'active':''}" onclick="setGalleryFilter('sample')">示例</button></div></div></div><section class="project-grid"><article class="project-card new" onclick="newProject()"><div class="plus">＋</div><h3>新建判断场景</h3><p>定义一个边界清楚、答案空间有限、可用标签验证的判断任务。</p><span class function sceneView(){return stageHead(0,'先定义一个边界清楚的判断契约。当前 MVP 聚焦 Choice 三分类：模型不生成长文本，只在允许答案中做选择并返回概率。')+`<div class="card hero-card"><div class="hero-orb"></div><div class="stage-icon">◇</div><label class="field"><span>判断场景名称</span><input id="sceneName" maxlength="100" placeholder="例如：设备质检分级" value="${esc(s.name)}"></label><label class="field"><span>描述模型需要判断什么</span><textarea id="sceneDescription" maxlength="2000" placeholder="输入是什么？black / white / gray 分别代表什么？什么情况下必须转人工？">${esc(s.description)}</textarea><small>场景描述定义任务语义；最终正确答案来自有标签样本与可验证规则。</small></label><div class="contract-box"><div class="contract-cell"><small>判断类型</small><strong>Choice · 三分类</strong></div><div class="contract-cell"><small>候选答案</small><strong>black / white / gray</strong></div><div class="contract-cell"><small>核心输出</small><strong>choice + probabilities</strong></div><div class="contract-cell"><small>低置信度</small><strong>转人工 / 上层模型</strong></div></div><div class="note"><b>关键变化：</b> reason 不再是核心判断模型的生成目标。样本中的 reason / evidence 可以用于审计、难例构造或独立解释层，但 Jev-style 判断模型本身只负责受限答案与概率。</div><div class="actions"><button class="primary" onclick="saveScene()">${s.scene?'保存判断任务并继续':'创建判断任务，准备样本'} →</button><button class="ghost" onclick="fillExample()">填入一个示例 ↗</button></div></div><div class="three"><div class="card slim"><span class="eyebrow">01 CONTRACT</span><h3 style="margin-top:10px">答案空间先定义</h3><p style="font-size:12px;margin-bottom:0">先定义 Choice，再训练模型；不是让模型自由生成 JSON。</p></div><div class="card slim"><span class="eyebrow">02 PROBABILITY</span><h3 style="margin-top:10px">概率必须可校准</h3><p style="font-size:12px;margin-bottom:0">准确率之外，Brier / ECE / threshold 同样是核心指标。</p></div><div class="card slim"><span class="eyebrow">03 POLICY</span><h3 style="margin-top:10px">判断进入软件流程</h3><p style="font-size:12px;margin-bottom:0">高置信度自动执行，低置信度进入复核或 System 2。</p></div></div>`;}

function saveScene(){const name=$('sceneName').value.trim(),description=$('sceneDescription').value.trim();if(!name||!description){toast('请填写场景名称和描述');return;}const run=()=>{if(s.scene&&(s.name!==name||s.description!==description))invalidate(1);s.name=name;s.description=description;s.scene=true;s.projectId=s.projectId||('sc_'+Date.now().toString(36));log('保存场景：'+name);go(1);};if(s.scene&&(s.name!==name||s.description!==description)&&s.prepared)confirmAction('创建新的场景修订','场景语义变化后，下游数据准备、训练与测试需要重新执行。本 Demo 会清除下游模拟结果。',run);else run();}

function seedView(){if(!s.scene)return blocked('先定义判断任务','填写名称、描述并确认 Choice 契约后，再准备决策样本。',0);return stageHead(1,'样本的核心是 state → 正确 choice。reason / evidence 可以保留做审计，但不再被强制当成生成目标。')+(s.seed?`<div class="card"><div class="row spread"><h3>▤ ${esc(s.seed.filename)}</h3><button class="small ghost" onclick="replaceSeed()">更换文件</button></div><div class="stats"><div class="stat"><small>决策样本 · 实际读取</small><strong>${s.seed.rows.length}</strong><em>仅浏览器处理</em></div><div class="stat"><small>State 输入字段</small><strong>${Object.keys(s.seed.rows[0]).filter(k=>!['decision','reason','evidence','score','confidence','origin','item'].includes(k)).length}</strong></div><div class="stat"><small>Choice 类别</small><strong>${counts().filter(n=>n>0).length}</strong></div><div class="stat"><small>Evidence 注释</small><strong>${s.seed.rows.filter(r=>r.reason||r.evidence).length}</strong><em>可选 · 非模型输出</em></div></div>${distribution()}<h3 style="margin:24px 0 12px">样本预览 · 前六条</h3>${table(s.seed.rows)}<div class="note">训练目标只读取 decision；reason / evidence 默认作为审计元数据，不进入自由文本生成。目标字段永远排除在 state 输入之外。</div>${s.prepared?`<div class="three"><div class="card slim"><small class="muted">训练集</small><h2>${s.split.train} 条</h2></div><div class="card slim"><small class="muted">校准 / 验证集</small><h2>${s.split.valid} 条</h2></div><div class="card slim"><small class="muted">冻结测试集</small><h2>${s.split.test} 条</h2></div></div><div class="actions"><span class="pill">✓ 决策数据已准备</span><button class="primary" onclick="go(2)">进入训练集构造 →</button></div>`:`<div class="actions"><button class="primary" onclick="prepare()">检查并划分数据 →</button></div>`}</div>`:`<div class="card"><label class="upload" id="drop"><div class="icon">↥</div><strong>拖入决策样本，或点击选择</strong><small>CSV · 必须包含 decision / label；reason / evidence 可选</small><input type="file" id="file" accept=".csv,text/csv"></label><div class="actions"><button onclick="useSample()">使用内置 Choice 样本</button><button class="ghost" onclick="downloadSample()">下载示例 CSV ↗</button></div><div class= function csvParse(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell='';}else cell+=c;}if(quoted)throw Error('CSV 引号未闭合');row.push(cell);if(row.some(v=>v.trim()))rows.push(row);if(rows.length<2)throw Error('文件需要表头和至少一条数据');const headers=rows.shift().map(v=>v.replace(/^\uFEFF/,'').trim());if(headers.some(h=>!h)||new Set(headers).size!==headers.length)throw Error('表头不能为空或重复');const aliases={black:'black',white:'white',gray:'gray',grey:'gray','黑':'black','白':'white','灰':'gray'};return rows.map((vals,i)=>{if(vals.length!==headers.length)throw Error('第 '+(i+2)+' 行列数与表头不一致');const r=Object.fromEntries(headers.map((h,j)=>[h,vals[j]]));r.decision=aliases[String(r.decision??r.label??'').trim().toLowerCase()]||'';delete r.label;if(!r.decision)throw Error('第 '+(i+2)+' 行缺少有效三分类标签');return r;});}

function configView(){if(!s.synth)return blocked('先确认训练数据','完成训练集构造或选择仅用种子继续。',2);const model=s.config?.model||'Qwen3.5-2B + Decision Head',method=s.config?.method||'领域决策微调',trainN=s.split.train+s.synth.rows,inputN=Object.keys(s.seed.rows[0]||{}).filter(k=>!['decision','reason','evidence','score','confidence','origin','item'].includes(k)).length;return stageHead(3,'这里配置的是“怎么训练判断模型”，不是“怎么微调一个聊天模型”。LoRA / QLoRA 只是底层参数，一级选择是模型构型与训练配方。')+`<div class="card"><div class="row spread"><div><span class="eyebrow">JEV-STYLE TRAINING RECIPE</span><h3 style="margin-top:7px">推荐：领域决策微调 + 概率校准</h3></div><span class="pill">Decision SFT → Calibration → Threshold</span></div><div class="config-summary"><div class="summary-cell"><small>训练样本</small><strong>${trainN} 条</strong></div><div class="summary-cell"><small>判断契约</small><strong>Choice · 3 options</strong></div><div class="summary-cell"><small>核心输出</small><strong>概率分布</strong></div><div class="summary-cell"><small>最终策略</small><strong>自动 / 复核阈值</strong></div></div>${trainN<500?`<div class="note warn"><b>当前仅 ${trainN} 条训练样本：</b>适合验证训练链路，不足以证明生产效果。真实项目应优先补充真实标签、边界难例与独立校准集，再决定是否用教师模型或规则生成扩增样本。</div>`:''}<div class="section-head"><div><h3>01 / 训练目标不是“生成答案”，而是“把概率放对”</h3><p style="font-size:12px;margin:4px 0 0">同一模型同时优化正确选择、概率校准与边界鲁棒性。</p></div></div><div class="objective-grid"><div class="objective"><small>主任务</small><strong>Candidate Cross-Entropy</strong><em>选对允许答案</em></div><div class="objective"><small>概率校准</small><strong>Brier / Proper Scoring</strong><em>概率与真实命中率一致</em></div><div class="objective"><small>选择策略</small><strong>Threshold / Coverage</strong><em>低置信度进入复核</em></div><div class="objective"><small>鲁棒性</small><strong>Option-order Augment</strong><em>降低位置与措辞偏置</em></div></div><div class="section-head"><div><h3>02 / 选择模型构型</h3><p style="font-size:12px;margin:4px 0 0">优先训练“决策头 + 小型语义主干”，而不是继续保留完整聊天生成链。</p></div><span class="saved">正式版只开放跑通过的实现</span></div><div class="recipe-grid">${[

h-item"><b>Jev</b>RLCD 目标公开；完整架构、reward 与 recipe 未公开。</div><div class="research-item"><b>Cloudflare Clef</b>Qwen + decision routing head + LoRA；CE + Brier，再接 RLCD。</div><div class="research-item"><b>Nimble / Kev</b>允许候选 logits 上做 CE 微调；held-out temperature calibration。</div><div class="research-item"><b>Laya</b>ModernBERT/mmBERT encoder + decision transformer/scorer + proper scoring。</div><div class="research-item"><b>Decider</b>多任务 CE 决策训练后，再做 calibration-aware RL + KL。</div></div></details><div class="note">推荐策略：第一版先把 <b>领域决策微调 → Brier / Temperature Calibration → Threshold Policy</b> 真正跑通。RLCD-like 是第二阶段增强，而不是为了追“Jev”名字一开始就强上 RL。</div><div class="actions"><button class="primary" onclick="configure()">保存判断模型训练配方 →</button><button onclick="environment()">检查 / 切换执行环境</button>${s.config?'<span class="saved">修改配方会使当前下游模拟结果过期</span>':''}</div></div>`;}

function trainingView(){if(!s.config)return blocked('先选好训练配方','选择模型构型与判断模型训练配方后再启动。',3);const t=s.training,p=t?.progress||0,done=t?.status==='done',running=t?.status==='running',stages=trainingStages(),ce=(1.45*Math.exp(-p/34)+.10).toFixed(3),brier=(.31*Math.exp(-p/45)+.065).toFixed(3);return stageHead(4,'训练目标同时关注“选对”与“概率可信”。训练完成不等于可发布，还必须经过 calibration 与 frozen test。')+`<div class="card"><div class="row spread"><h3>${done?'✓ 判断模型模拟产物已就绪':running?'正在模拟 · '+stages[Math.min(3,Math.floor(p/25))]:t?.status==='cancelled'?'演示已取消':t?.status==='paused'?'演示动画已暂停':'判断模型训练已准备'}</h3><span class="pill blue">${running?'模拟运行中':done?'模拟完成':'待开始'}</span></div><p>${esc(s.config.model)} / ${esc(s.config.method)} · train ${s.split.train+s.synth.rows} 条 · valid ${s.split.valid} 条</p><div class="progress"><div style="width:${p}%"></div></div><div class="row spread"><span class="muted" style="font-size:12px">${p}% · 演示进度</span><span class="saved">不是实际训练耗时</span></div><div class="timeline">${stages.map((v,i)=>`<div class="${p>=(i+1)*25?'done':p>=i*25&&running?'running':''}">${p>=(i+1)*25?'✓ ':''}${v}</div>`).join('')}</div><div class="two"><div class="card slim"><div class="row spread"><h3>Decision Objective</h3><span class="saved">模拟数据</span></div>${curve(p)}</div><div class="card slim"><h3>当前目标</h3><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><small>Candidate CE · 模拟</small><strong>${ce}</strong></div><div class="stat"><small>Brier · 模拟</small><strong>${brier}</strong></div></div><p style="font-size:12px">核心训练不是让模型生成 reason，而是把概率质量做好。最终 Temperature / Threshold 只允许在 validation 上拟合，不能看 test 调参。</p></div></div><div class="actions">${done?'<button class="primary" onclick="go(5)">进入校准验证 →</button><span class="pill">mv_decision_001 · 非真实模型</span>':running?'<button class="danger" onclick="cancelTrain()">取消演示</button><button class="ghost" onclick="go(3)">查看训练配方</button>':`<button class="primary" onclick="startTrain()">${t?.status==='paused'?'继续演示':'开始判断模型训练演示'} →</button>`}</div></div>`;}
function startTrain(){if(s.env==='本机 CPU 数据实验'){modal('<h2>执行环境未就绪</h2><p>本机 CPU 环境只能准备数据。本 Demo 也模拟这一阻断：切换到 Windows GPU 或 Linux GPU 演示环境后继续。</p><button class="primary" onclick="environment()">选择演示环境</button>');return;}s.training={status:'running',progress:s.training?.status==='paused'?s.training.progress:0};log('开始模拟判断模型训练：'+s.config.method+'；无 GPU 调用，不产生权重。');clearInterval(timer);const stages=trainingStages();timer=setInterval(()=>{s.training.progress=Math.min(100,s.training.progress+5);const p=s.training.progress;if([25,50,75].includes(p))log('模拟阶段完成：'+stages[p/25-1]);if(p===100){clearInterval(timer);timer=null;s.training.status='done';log('模拟产物检查完成：mv_decision_001；包含 decision head / calibration 配置占位。');toast('判断模型训练演示完成，可进入校准验证');}save();if(s.step===4)render();else{renderStepsOnly();renderLogs();}},450);render();}
function renderStepsOnly(){$('steps').querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('done',complete(i));b.querySelector('.num').textContent=complete(i)?'✓':String(i+1).padStart(2,'0');});}
function cancelTrain(){clearInterval(timer);timer=null;s.training.status='cancelled';log('模拟任务已取消；可重新开始。');render();}
function evaluationView(){if(s.training?.status!=='done')return blocked('先完成判断模型训练','产物就绪后，才能做概率校准、阈值选择和冻结测试。',4);return stageHead(5,'判断模型不能只看 Accuracy。这里把校准、自动化覆盖率和边界鲁棒性放到与准确率同等重要的位置。')+`<div class="card"><div class="row spread"><h3>mv_decision_001 · Calibration & Validation</h3><span class="pill warn">所有指标为预置演示值</span></div><div class="tab-row" style="margin-top:20px"><button class="${reportTab==='overview'?'active':''}" onclick="reportTab='overview';render()">校准报告</button><button class="${reportTab==='try'?'active':''}" onclick="reportTab='try';render()">在线判断</button><button class="${reportTab==='errors'?'active':''}" onclick="reportTab='errors';render()">边界样本</button></div>${reportTab==='overview'?`<div class="note warn">下面的数据只展示 SystemOneStudio 应该怎样评估 Jev-style 模型，并非真实训练结果。</div><h3>判断质量</h3><div class="metric-grid" style="margin:16px 0 25px"><div class="metric"><small>Choice Accuracy · 模拟</small><strong>92.0%</strong><span>冻结 test top-1</span></div><div class="metric"><small>Macro-F1 · 模拟</small><strong>90.8%</strong><span>避免多数类掩盖问题</span></div><div class="metric"><small>P95 延迟 · 模拟</small><strong>86 <span>ms</span></strong><span>完整 typed decision</span></div></div><h3>概率校准</h3><div class="metric-grid" style="margin:16px 0 25px"><div class="metric"><small>Brier Score · 模拟</small><strong>0.084</strong><span>越低越好</span></div><div class="metric"><small>ECE · 模拟</small><strong>0.031</strong><span>预测概率 vs 实际命中</span></div><div class="metric"><small>NLL · 模拟</small><strong>0.27</strong><span>高置信错误会被重罚</span></div></div><h3>自动化策略 · confidence ≥ 0.90</h3><div class="metric-grid" style="margin:16px 0"><div class="metric"><small>自动覆盖率 · 模拟</small><strong>68%</strong><span>其余 32% 进入复核</span></div><div class="metric"><small>自动区错误率 · 模拟</small><strong>2.6%</strong><span>阈值在 valid 上选择</span></div><div class="metric"><small>Option-order Flip · 模拟</small><strong>1.0%</strong><span>交换候选顺序后的变化率</span></div></div><div class="policy-box"><b>真正的发布条件不是“Accuracy ≥ 90%”：</b>需要同时满足校准质量、目标错误预算下的 coverage、OOD / 边界样本表现以及选项顺序鲁棒性。</div><div class="actions"><button class="primary" onclick="finishEvaluation()">确认演示报告，进入发布 →</button><button onclick="reportTab='try';render()">试一个判断</button></div>`:reportTab==='try'?`<p>这里模拟 Jev-style 输出：只返回允许答案、每个答案的概率，以及基于阈值的执行策略，不生成解释文本。</p><label class="field"><span>State · JSON</span><textarea id="testInput" rows="5">${esc(JSON.stringify({deviation:6.2,temperature:78,surface:'明显缺陷'},null,2))}</textarea></label><button class="primary" onclick="trySample()">运行判断演示 ↗</button><div id="testResult">${testResult?resultHtml(testResult):''}</div>`:`<div class="note warn">预置边界案例，不来自真实模型。</div><div class="table-scroll"><table><thead><tr><th>案例</th><th>真实 Choice</th><th>预测</th><th>confidence</th><th>策略</th></tr></thead><tbody><tr><td>EDGE-014</td><td>${label('gray')}</td><td>${label('white')}</td><td>0.56</td><td>人工复核</td></tr><tr><td>EDGE-037</td><td>${label('white')}</td><td>${label('black')}</td><td>0.93</td><td>高置信错误 · 重点分析</td></tr><tr><td>ORDER-082</td><td>${label('gray')}</td><td>${label('gray')}</td><td>0.71</td><td>交换选项后保持一致</td></tr></tbody></table></div><p style="font-size:12px;margin-top:17px">正式产品应支持 reliability diagram、confidence bin、阈值扫描、option permutation、OOD 与 hard-negative 专项集。</p>`}</div>`;}
function resultHtml(r){return `<div class="result" style="margin-top:20px"><span class="eyebrow">TYPED DECISION · DEMO</span><h3>${label(r.choice)} · confidence ${(r.confidence*100).toFixed(0)}%</h3><div class="prob-bars">${Object.entries(r.probabilities).map(([k,v])=>`<div class="prob-row"><span>${esc(k)}</span><span class="prob-track"><i style="width:${v*100}%"></i></span><b>${(v*100).toFixed(1)}%</b></div>`).join('')}</div><div class="policy-box"><b>Policy:</b> ${r.action==='auto'?'自动执行':'转人工复核'} · threshold 0.90</div><pre class="code">${esc(JSON.stringify(r,null,2))}</pre><small class="muted">Demo 概率由规则模拟，不是模型推理，也不代表真实校准结果。</small></div>`;}
function trySample(){try{const x=JSON.parse($('testInput').value);if(!x||typeof x!=='object'||Array.isArray(x)||!Number.isFinite(Number(x.deviation)))throw Error('请输入对象，并包含数值 deviation');const d=Number(x.deviation);let probabilities;if(d>=7)probabilities={black:.94,gray:.04,white:.02};else if(d>=5)probabilities={black:.56,gray:.39,white:.05};else if(d<2.5)probabilities={white:.93,gray:.05,black:.02};else probabilities={gray:.68,white:.20,black:.12};const choice=Object.entries(probabilities).sort((a,b)=>b[1]-a[1])[0][0],confidence=Math.max(...Object.values(probabilities));testResult={type:'choice',choice,probabilities,confidence,action:confidence>=.90?'auto':'review'};$('testResult').innerHTML=resultHtml(testResult);log('运行 typed decision 演示；无自由文本生成。');renderLogs();}catch(e){$('testResult').innerHTML='<div class="note error" role="alert">'+esc(e.message)+'</div>';}}
function finishEvaluation(){s.evaluated=true;log('确认预置演示报告，进入交付。');go(6);}
function exportView(){if(!s.evaluated)return blocked('先完成校准验证','确认概率校准、阈值与冻结测试结果后再发布。',5);return stageHead(6,'发布的是“判断模型 + 决策契约 + 校准参数 + 阈值策略”，而不是只有一份小模型权重。')+`<div class="two"><div class="card"><div class="stage-icon">↧</div><h3>导出判断模型包</h3><p>标准交付包含 backbone / decision head、calibration、Decision Schema、阈值策略、评测与 lineage。</p><div class="badge-line"><span class="pill">Typed Decision</span><span class="pill blue">Calibration 固化</span></div><div class="note warn">Demo 只下载 JSON 清单，不含真实权重。</div><button class="primary" onclick="exportManifest()">下载演示交付清单 ↧</button></div><div class="card"><div class="stage-icon">↗</div><h3>启动 System One API</h3><p>输入 state + typed question，输出 choice + probabilities；业务动作由上层 policy 决定。</p><div class="badge-line"><span class="pill ${s.serving?'':'warn'}">${s.serving?'● 模拟运行中':'○ 未启动'}</span></div><div class="note">此处只切换演示状态，不启动真实进程。</div><button class="${s.serving?'danger':'primary'}" onclick="toggleService()">${s.serving?'停止服务演示':'启动服务演示 ↗'}</button></div></div>${s.serving?`<div class="card"><div class="row spread"><h3>Jev-style 调用示例 · 无真实服务</h3><button class="small" onclick="copyExample()">复制示例</button></div><pre class="code" id="curl">${esc(curl())}</pre></div>`:''}<div class="card"><div class="row spread"><div><h3>保存整个工作区</h3><p style="margin-bottom:0">导出 Decision Schema、数据、训练配方、校准策略与演示记录。</p></div><div class="row"><button onclick="exportWorkspace()">下载工作区演示备份</button><button onclick="$('restore').click()">导入演示备份</button></div></div><div class="note warn">真实发布前应固定模型 revision、calibration 参数、threshold policy 和 test report，缺一项都不算可复现的判断模型。</div></div>`;}
function download(name,content,type='application/json'){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function downloadSample(){const rows=sampleRows(),keys=Object.keys(rows[0]),quote=v=>'"'+String(v).replace(/"/g,'""')+'"';download('SystemOneStudio-示例种子.csv','\uFEFF'+[keys,...rows.map(r=>keys.map(k=>r[k]))].map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function exportManifest(){download('SystemOneStudio-DEMO-判断模型交付清单.json',JSON.stringify({demo:true,contains_model_weights:false,version:'mv_decision_001',scene:{name:s.name,description:s.description},decision_schema:{type:'choice',criteria:{black:'不通过',white:'通过',gray:'待复核'}},config:s.config,seed_rows:s.seed.rows.length,synth:s.synth,evaluation:'固定演示报告，非实测',expected_real_package:['backbone-q4.gguf','decision_head.safetensors','calibration.json','decision_schema.json','threshold_policy.json','evaluation.json','lineage.json','checksums.txt','README.md']},null,2));log('导出演示判断模型清单；不包含权重。');renderLogs();toast('已下载演示清单');}
function exportWorkspace(){download('SystemOneStudio-DEMO-工作区.json',JSON.stringify({...s,demo:true,serving:false},null,2));toast('已下载演示备份，可在本 HTML 导入');}
function toggleService(){s.serving=!s.serving;log(s.serving?'模拟服务健康检查与示例调用通过；没有真实监听端口。':'服务演示已停止。');render();}
function curl(){return `# 演示地址，无法实际调用\ncurl https://studio.example.invalid/v1/systemone \\\n  -H "Content-Type: application/json" \\\n  -d '{\n    "model":"mv_decision_001",\n    "state":{"deviation":6.2,"surface":"明显缺陷"},\n    "questions":{"quality":{"type":"choice","criteria":{"black":"不通过","white":"通过","gray":"待复核"}}}\n  }'`;}
async function copyExample(){try{await navigator.clipboard.writeText(curl());toast('已复制演示调用示例');}catch{toast('浏览器不允许剪贴板访问，请选中文本复制');}}
$('restore').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024)throw Error('备份超过演示大小限制');const x=JSON.parse(await f.text());if(x.schema!==3||x.demo!==true||typeof x.name!=='string'||typeof x.description!=='string'||!Array.isArray(x.logs)||!x.seed||!Array.isArray(x.seed.rows)||!Number.isInteger(x.step)||x.step<0||x.step>6)throw Error('不是有效的本 Demo 工作区备份');confirmAction('导入演示工作区','将替换当前浏览器的演示进度，服务状态会恢复为未启动。',()=>{clearInterval(timer);timer=null;s={...fresh(),...x,serving:false};if(s.training?.status==='running')s.training.status='paused';log('导入演示工作区；服务未启动。');testResult=null;save();render();toast('演示工作区已恢复');});}catch(err){toast('无法导入：'+err.message);}finally{e.target.value='';}};
renderHome();
</script>
</body></html>
