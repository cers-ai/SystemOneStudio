# SystemOneStudio web gateway.
#
# Serves the SPA and proxies the control plane, so the browser only ever talks to
# one origin. That removes CORS entirely and keeps cookies first-party.
#
# Port 80 inside the container; the compose file publishes it as 9969.

upstream son_api {
    # Service name, not an IP: Docker's DNS handles the address.
    server api:9969;
    keepalive 16;
}

# WebSocket upgrade map. Declared in the http context, which is why it lives in
# its own file included from nginx.conf rather than inline here.
include /etc/nginx/connection_upgrade.conf;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    client_max_body_size 256m;   # dataset uploads

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # Container-local liveness, distinct from the API's own /health.
    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","component":"web"}';
    }

    # --- API paths -----------------------------------------------------------
    # Each path the control plane serves is listed explicitly rather than using a
    # blanket /api/ proxy, so a new backend route is a deliberate edit here and a
    # typo cannot silently fall through to the SPA and return index.html.
    location /api/       { proxy_pass http://son_api; include /etc/nginx/proxy_params_son.conf; }
    location /meta/      { proxy_pass http://son_api; include /etc/nginx/proxy_params_son.conf; }
    location /health     { proxy_pass http://son_api; include /etc/nginx/proxy_params_son.conf; }
    location /v1/        { proxy_pass http://son_api; include /etc/nginx/proxy_params_son.conf; }
    location /docs       { proxy_pass http://son_api; include /etc/nginx/proxy_params_son.conf; }
    location /openapi.json { proxy_pass http://son_api; include /etc/nginx/proxy_params_son.conf; }

    # --- Hashed build assets -------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA fallback -------------------------------------------------------
    # Client-side routing: unknown paths must return index.html so the router can
    # resolve them, not a 404.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}