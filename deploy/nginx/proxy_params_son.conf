# Shared proxy settings for API paths.
#
# Kept separate from default.conf so the upstream target and these headers are
# declared once.

proxy_http_version 1.1;

# Pass the client's address and protocol through so audit logs and any
# scheme-relative links in responses are correct.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Do not buffer: the training-progress stream is a WebSocket and a
# chunked/streaming response, and buffering would defeat both.
proxy_buffering off;
proxy_request_buffering off;

# Training and inference can be slow. The requirement's own P95 target is 100ms
# for inference, but /api/trainings holds a long-lived connection, so the read
# timeout is generous while connect/header timeouts stay short.
proxy_connect_timeout 5s;
proxy_send_timeout    3600s;
proxy_read_timeout    3600s;

# WebSocket upgrade, used by the training monitor (WebSocket per 需求方案.txt 11).
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;