name: systemone-studio

# Local Docker Desktop experiment: one application, one URL, persistent assets.
# No GPU training is advertised by this CPU image.
services:
  studio:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: systemone-studio:cpu-dev
    restart: unless-stopped
    ports:
      - '${SON_PUBLIC_PORT:-9969}:9969'
    environment:
      SON_DB_PATH: /data/systemone.db
      SON_WORKSPACE: /data/workspace
      SON_EXECUTION_MODE: cpu
    volumes:
      - ${SON_DATA_DIR:-./runtime}:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9969/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
