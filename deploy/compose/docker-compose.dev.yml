name: systemone-studio

# Local development dependencies only. GPU services (training, quantization,
# llama.cpp inference) are deliberately absent: this machine has no NVIDIA GPU
# (see AGENTS.md), and those services ship from deploy/gpu/ instead.
#
#   docker compose -f deploy/compose/docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: son-postgres
    environment:
      POSTGRES_USER: son
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-son_local_only}
      POSTGRES_DB: sonstudio
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U son -d sonstudio']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: son-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sonminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sonminio_local_only}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: son-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  minio-data:
  redis-data:
