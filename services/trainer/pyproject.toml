[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "son-trainer"
version = "0.1.0"
description = "SFT / LoRA / QLoRA / DPO training pipeline orchestration."
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.7",
  "son-contracts",
  "son-model-registry",
]

[project.optional-dependencies]
# Training stack. Pinned loosely: exact versions depend on the CUDA version on
# the target node, so the GPU image installs these at build time against that
# node's toolkit rather than freezing them here.
train = [
  "torch>=2.4",
  "transformers>=4.44",
  "peft>=0.12",
  "trl>=0.9",
  "bitsandbytes>=0.43",
  "accelerate>=0.33",
  "datasets>=2.20",
  "safetensors>=0.4",
]
[tool.hatch.build.targets.wheel]
packages = ["src/son_trainer"]

[tool.uv.sources]
son-contracts = { workspace = true }
son-model-registry = { workspace = true }
