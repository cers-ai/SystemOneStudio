[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "son-inference"
version = "0.1.0"
description = "llama.cpp server orchestration and schema enforcement."
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "pandas>=2.2",
  "son-contracts",
]

[project.optional-dependencies]
# Inference talks to a llama.cpp server over HTTP, so there is no Python
# inference dependency. httpx is already a main dependency.
[tool.hatch.build.targets.wheel]
packages = ["src/son_inference"]

[tool.uv.sources]
son-contracts = { workspace = true }
