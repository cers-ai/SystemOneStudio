[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "son-inference"
version = "0.1.0"
description = "llama.cpp server orchestration and schema enforcement."
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "son-contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["src/son_inference"]

[tool.uv.sources]
son-contracts = { workspace = true }
