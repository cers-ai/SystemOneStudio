[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "son-quantizer"
version = "0.1.0"
description = "LoRA merge and GGUF quantization (Q4_K_M default)."
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.7",
  "son-contracts",
]

[project.optional-dependencies]
# Needed only to merge LoRA weights into the base model. The GGUF conversion and
# quantization steps shell out to llama.cpp binaries instead.
merge = [
  "torch>=2.4",
  "transformers>=4.44",
  "peft>=0.12",
  "safetensors>=0.4",
]
[tool.hatch.build.targets.wheel]
packages = ["src/son_quantizer"]

[tool.uv.sources]
son-contracts = { workspace = true }
