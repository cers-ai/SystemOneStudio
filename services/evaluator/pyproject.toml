[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "son-evaluator"
version = "0.1.0"
description = "Performance-first and effect-second evaluation reporting."
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.7",
  "numpy>=1.26",
  "son-contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["src/son_evaluator"]

[tool.uv.sources]
son-contracts = { workspace = true }
