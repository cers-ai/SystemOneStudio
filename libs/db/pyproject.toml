[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "son-db"
version = "0.1.0"
description = "SQLite persistence and the run-asset workspace."
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
]

[tool.hatch.build.targets.wheel]
# Includes everything under src/son_db, migrations/*.sql included: a deployed
# image has to be able to bring its own schema up to date. Do not add a
# force-include for it -- that would require the directory to exist before the
# dependency layer is installed, which breaks the layered Docker build.
packages = ["src/son_db"]

[tool.uv.sources]