[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "son-db"
version = "0.1.0"
description = "SQLite persistence and the run-asset workspace."
requires-python = ">=3.11,<3.12"
dependencies = [
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/son_db"]

# The migrations directory ships inside the package: a deployed image has to be
# able to bring its own schema up to date.
[tool.hatch.build.targets.wheel.force-include]
"src/son_db/migrations" = "son_db/migrations"

[tool.uv.sources]