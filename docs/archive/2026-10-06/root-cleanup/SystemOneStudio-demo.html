<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 95% 0,#13363888,transparent 42%),var(--bg);color:var(--text);font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button,a,input,select,textarea,summary{outline-offset:4px}button:focus-visible,a:focus-visible{outline:2px solid var(--mint)}button{border:1px solid var(--line);background:#ffffff06;color:var(--text);border-radius:9px;padding:10px 17px;transition:.18s}button:hover:not(:disabled){border-color:#65f0ce66;background:#65f0ce0b}.primary{background:var(--mint);border-color:var(--mint);color:#08281f;font-weight:650}.primary:hover:not(:disabled){background:#92ffe2}.ghost{border-color:transparent;color:var(--muted)}.small{padding:6px 10px;font-size:12px}.danger{color:#ffacb5}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spread{justify-content:space-between}.muted{color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--mint)}h1,h2,h3,p{margin:0}h1{font-size:30px;letter-spacing:-1px;line-height:1.4}h2{font-size:23px;line-height:1.5}h3{font-size:16px}p{margin:8px 0 18px;color:var(--muted)}.pill{font-size:11px;color:var(--mint);background:#65f0ce10;border:1px solid #65f0ce22;border-radius:30px;padding:3px 10px}.pill.warn{color:var(--warn);background:#ffcd860b;border-color:#ffcd8622}.pill.blue{color:var(--blue);background:#92abff0d;border-color:#92abff22}
header{height:76px;padding:0 4vw;display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line)}.brand{border:0;background:none;display:flex;align-items:center;gap:10px;padding:0;font-size:19px;font-weight:650}.brand i{display:grid;place-items:center;width:31px;height:34px;background:var(--mint);color:#092d22;border-radius:8px;font-style:normal}.brand span span{color:var(--muted);font-weight:400}.header-right{margin-left:auto;display:flex;gap:10px;align-items:center}.demo-strip{padding:7px 4vw;background:#ffcd8608;border-bottom:1px solid #ffcd8617;color:#bfad8e;font-size:11px;letter-spacing:.4px}.demo-strip b{color:var(--warn);margin-right:12px}.shell{max-width:1510px;margin:auto;padding:36px 4vw 65px}.title-row{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.title-row p{margin:6px 0 0;max-width:840px}.breadcrumbs{color:var(--muted);font-size:11px;margin-bottom:11px}.breadcrumbs span{color:var(--mint)}.steps{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:30px;background:#ffffff03}.steps button{border:0;border-right:1px solid var(--line);border-radius:0;display:flex;align-items:center;gap:12px;justify-content:center;padding:19px 8px;color:var(--muted);position:relative}.steps button:last-child{border:0}.steps button.active{color:var(--mint);background:#65f0ce0a;box-shadow:inset 0 -2px var(--mint)}.steps .num{font-size:11px;color:#536c86}.steps button.done .num{color:var(--mint)}.steps button.active .num{color:var(--mint)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:30px}.layout.wide{grid-template-columns:1fr}.aside{border-left:1px solid var(--line);padding-left:25px}.aside h3{margin:10px 0 25px}.aside dl{margin:0}.aside dt{font-size:11px;color:var(--muted)}.aside dd{margin:4px 0 20px;font-size:13px}.aside .divider{border-top:1px solid var(--line);margin:22px 0}.aside p{font-size:12px}.stage-title{margin:1px 0 22px}.stage-title .eyebrow{display:block;margin-bottom:7px}.stage-title p{margin-top:7px}.card{background:linear-gradient(140deg,#162230b3,#101925d9);border:1px solid var(--line);border-radius:15px;padding:27px;margin-bottom:18px}.card.slim{padding:19px}.field{display:block;margin-bottom:22px}.field span{display:block;font-size:12px;color:#bcccdc;margin-bottom:8px}.field small{display:block;color:var(--muted);margin-top:8px;font-size:11px}input:not([type=checkbox]),textarea,select{display:block;width:100%;background:#0a1420;color:var(--text);border:1px solid #293c50;border-radius:8px;padding:11px 13px}textarea{resize:vertical;min-height:105px}input:focus,textarea:focus,select:focus{border-color:var(--mint);outline:none;box-shadow:0 0 0 3px #65f0ce0a}.two{display:grid;grid-template-columns:1fr 1fr;gap:17px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.choice{border:1px solid var(--line);border-radius:11px;padding:20px;cursor:pointer;background:#ffffff02;position:relative;display:block}.choice:hover{border-color:#65f0ce55}.choice.selected{border-color:#65f0ce88;background:#65f0ce09}.choice .tick{float:right;color:var(--mint)}.choice strong{display:block;margin:7px 0}.choice small{color:var(--muted);font-size:11px}.choice input{position:absolute;opacity:0}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px}.note{background:#65f0ce07;border:1px solid #65f0ce1c;color:#b4d3cb;border-radius:8px;padding:11px 15px;font-size:12px;margin:18px 0}.note.warn{color:#d8c09d;background:#ffcd8608;border-color:#ffcd8620}.note.error{color:#ffbdc5;border-color:#ffbdc530;background:#ffbdc50a}.upload{display:block;text-align:center;border:1px dashed #65f0ce55;border-radius:12px;padding:37px 20px;background:#65f0ce04;cursor:pointer}.upload .icon{font-size:30px;color:var(--mint);margin-bottom:12px}.upload strong{display:block;font-size:16px}.upload small{color:var(--muted);display:block;margin:7px 0}.upload input{display:none}.upload.drag{background:#65f0ce18}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:23px 0}.stat{border-right:1px solid var(--line)}.stat:last-child{border:0}.stat small{color:var(--muted);display:block;font-size:11px}.stat strong{display:block;font-size:28px;letter-spacing:-1px;margin:4px 0}.stat em{font-style:normal;font-size:10px;color:var(--mint)}.table-scroll{overflow:auto;max-height:310px;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}th{color:var(--muted);font-weight:400;background:#0e1825;position:sticky;top:0}th,td{padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap}td.reason{max-width:250px;white-space:normal}.label{font-size:10px;padding:3px 8px;border-radius:5px}.black{color:#ffb4bb;background:#ffb4bb12}.white{color:var(--mint);background:#65f0ce10}.gray{color:#c6c6ee;background:#c6c6ee10}.bar{height:7px;background:#ffffff0b;border-radius:9px;overflow:hidden;display:flex;margin:17px 0}.bar span{display:block;height:100%}.legend{display:flex;gap:23px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.legend i{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px}.progress{height:5px;background:#ffffff0a;border-radius:20px;margin:21px 0}.progress div{background:var(--mint);height:100%;border-radius:20px;transition:width .35s}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.timeline div{font-size:11px;color:#61788e;border-top:2px solid #ffffff12;padding-top:10px}.timeline .done{color:var(--mint);border-color:var(--mint)}.timeline .running{color:var(--text);border-color:var(--blue)}svg.chart{width:100%;height:170px}.chart text{fill:#71869d;font-size:9px}.chart .grid{stroke:#ffffff0b}.chart .curve{stroke:var(--mint);fill:none;stroke-width:2}.chart .area{fill:url(#fade)}.empty{text-align:center;padding:60px 22px;border:1px dashed var(--line);border-radius:15px}.empty .icon{font-size:28px;color:#5d7891}.empty h3{margin:13px 0}.empty p{margin-bottom:24px}.footer-log{border:1px solid var(--line);border-radius:10px;margin-top:26px;overflow:hidden}.footer-log summary{padding:13px 17px;color:var(--muted);cursor:pointer;font-size:11px}.logs{font:11px/1.9 Consolas,monospace;background:#080e17;padding:16px 20px;max-height:220px;overflow:auto;color:#99c0b7;white-space:pre-wrap}.tab-row{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:22px}.tab-row button{border:0;border-radius:0;padding:9px 14px;color:var(--muted)}.tab-row .active{color:var(--mint);box-shadow:inset 0 -2px var(--mint)}.result{background:#0b1820;border:1px solid #65f0ce25;border-radius:11px;padding:21px}.result h3{color:var(--mint);margin:9px 0}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{background:#ffffff03;border:1px solid var(--line);border-radius:10px;padding:19px}.metric strong{display:block;font-size:26px;margin-top:7px}.metric small{color:var(--muted);font-size:11px}.metric span{color:#8799b0;font-size:10px}.code{background:#080e17;border:1px solid var(--line);border-radius:9px;padding:16px;font:11px/1.9 Consolas,monospace;white-space:pre-wrap;word-break:break-all;color:#aed2c5;max-height:260px;overflow:auto}.modal{position:fixed;inset:0;z-index:10;background:#000a;backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}.modal-box{width:min(560px,100%);border:1px solid #ffffff25;border-radius:17px;padding:30px;background:#132030;box-shadow:0 25px 100px #0008}.modal-box h2{margin-bottom:12px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1f3c35;border:1px solid #65f0ce44;color:#d7fff3;border-radius:9px;padding:12px 23px;z-index:30;max-width:90vw;box-shadow:0 12px 40px #0008}.saved{color:var(--muted);font-size:10px}.status-dot{width:5px;height:5px;background:var(--mint);border-radius:50%;display:inline-block;margin-right:5px}.hero-orb{position:absolute;right:5%;top:5%;width:190px;height:190px;border:1px solid #65f0ce20;border-radius:50%;box-shadow:inset 0 0 70px #65f0ce09,0 0 80px #65f0ce06;pointer-events:none}.hero-orb:before,.hero-orb:after{content:"";position:absolute;inset:24px -10px;border:1px solid #65f0ce28;border-radius:50%;transform:rotate(50deg)}.hero-orb:after{transform:rotate(-50deg);inset:45px -20px}.hero-card{position:relative;overflow:hidden;padding:32px}.hero-card .field{max-width:70%;position:relative}.badge-line{display:flex;gap:7px;margin:15px 0}.mono{font:11px Consolas,monospace}.stage-icon{color:var(--mint);font-size:21px;margin-bottom:12px}.hidden{display:none!important}a{color:var(--mint)}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.aside{border:0;padding:20px 0;border-top:1px solid var(--line)}.steps{overflow-x:auto;grid-template-columns:repeat(7,minmax(115px,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.header-right .saved{display:none}.hero-orb{opacity:.4}.hero-card .field{max-width:100%}}
@media(max-width:650px){header{padding:0 20px}.shell{padding:25px 20px}.header-sub{display:none}.title-row{align-items:flex-start}h1{font-size:24px}.two,.three,.metric-grid{grid-template-columns:1fr}.hero-orb{display:none}.timeline{grid-template-columns:repeat(2,1fr)}.stats{gap:20px}.demo-strip{padding:8px 20px}.brand{font-size:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><button class="brand" onclick="go(0)" aria-label="返回场景"><i>S</i><span>SystemOne<span>Studio</span></span></button><span class="header-sub muted" style="font-size:11px">DECISION MODEL WORKSPACE</span><div class="header-right"><span class="saved" id="saved">本浏览器保存</span><button class="small ghost" onclick="environment()">◉ 执行环境</button><button class="small ghost" onclick="resetDemo()">重置演示</button></div></header>
<div class="demo-strip"><b>交互原型 · DEMO</b>离线单文件。训练、合成效果、评测及部署均为模拟，不连接服务器、不产生模型权重。上传文件仅在浏览器读取。</div>
<main class="shell"><div class="title-row"><div><div class="breadcrumbs">我的工作区 / <span id="workspaceLabel">新场景</span></div><h1 id="title">把你的判断，变成模型的能力。</h1><p id="subtitle">从一份种子数据开始，在一个工作区走完训练与交付。</p></div><button class="small ghost" id="toggle" onclick="toggleAside()">收起摘要 ⇥</button></div><nav class="steps" aria-label="七步流程" id="steps"></nav><div class="layout" id="layout"><section id="canvas" aria-live="polite"></section><aside class="aside" id="aside"></aside></div><details class="footer-log" id="logbox"><summary id="logTitle">⌘ 活动记录 · 展开查看</summary><div class="logs" id="logs"></div></details></main>
<div id="dialog"></div><div id="toast" role="status" class="toast hidden"></div><input type="file" id="restore" class="hidden" accept=".json,application/json">
<script>
'use strict';
const KEY='systemone-demo-v1';const titles=['场景','种子数据','数据合成','训练配置','训练','测试验证','导出部署'];
const fresh=()=>({schema:1,step:0,name:'',description:'',scene:false,seed:null,prepared:false,synth:null,config:null,training:null,evaluated:false,serving:false,env:'Windows + WSL2 / Docker',logs:[]});
let s=fresh(),timer=null,showAside=true,testResult=null,reportTab='overview';
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&saved.schema===1)s={...fresh(),...saved};}catch{}
if(s.training?.status==='running'){s.training.status='paused';s.logs.push('演示动画已暂停，可继续演示；真实服务器任务不会因关闭浏览器而停止。');}
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));$('saved').textContent='● 已保存在本浏览器';}catch{$('saved').textContent='浏览器存储不可用，可导出演示备份';}}
function log(t){s.logs.push(new Date().toLocaleTimeString('zh-CN',{hour12:false})+'  '+t);s.logs=s.logs.slice(-60);save();}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000);}
function complete(i){return [s.scene,s.prepared,!!s.synth,!!s.config,s.training?.status==='done',s.evaluated,s.serving][i];}
function go(i){s.step=i;save();render();}
function next(){go(Math.min(6,s.step+1));}
function toggleAside(){showAside=!showAside;$('aside').classList.toggle('hidden',!showAside);$('layout').classList.toggle('wide',!showAside);$('toggle').textContent=showAside?'收起摘要 ⇥':'展开摘要 ⇤';}
function modal(html){$('dialog').innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="modal-box">'+html+'<div class="actions"><button onclick="closeModal()">关闭</button></div></div></div>';$('dialog').querySelector('button')?.focus();}
function closeModal(){$('dialog').innerHTML='';}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
function confirmAction(title,text,action){modal('<h2>'+title+'</h2><p>'+text+'</p><button class="primary" id="confirmButton">确认并继续</button>');$('confirmButton').onclick=()=>{closeModal();action();};}
function resetDemo(){confirmAction('重新开始演示','会清除本浏览器的演示进度。已下载的文件不受影响。',()=>{clearInterval(timer);timer=null;s=fresh();testResult=null;save();render();});}
function environment(){modal(`<span class="eyebrow">EXECUTION ENVIRONMENT · 模拟</span><h2>浏览器入口，跨系统运行</h2><p>此处演示环境选择，不会检测或连接你的机器。</p><label class="field"><span>执行环境</span><select id="env"><option>Windows + WSL2 / Docker</option><option>Linux + NVIDIA / Docker</option><option>Windows 原生（待工具链验证）</option><option>本机 CPU 数据实验</option></select></label><div class="note">Windows GPU 主机可通过 WSL2 承载 Linux GPU 容器，复用同一套应用。原生 Windows 路线需要单独验收。</div><button class="primary" onclick="s.env=$('env').value;log('切换演示环境：'+s.env);closeModal();render()">应用演示环境</button>`);$('env').value=s.env;}
function blocked(title,detail,target){return `<div class="empty"><div class="icon">◇</div><h3>${title}</h3><p>${detail}</p><button class="primary" onclick="go(${target})">前往${titles[target]} →</button></div>`;}
function stageHead(i,text){return `<div class="stage-title"><span class="eyebrow">STEP ${String(i+1).padStart(2,'0')} / 07</span><h2>${titles[i]}</h2><p>${text}</p></div>`;}
function render(){
 $('workspaceLabel').textContent=s.name||'新场景';$('title').textContent=s.scene?s.name:'把你的判断，变成模型的能力。';$('subtitle').textContent=s.scene?s.description:'从一份种子数据开始，在一个工作区走完训练与交付。';
 $('steps').innerHTML=titles.map((t,i)=>`<button class="${s.step===i?'active':''} ${complete(i)?'done':''}" aria-current="${s.step===i?'step':'false'}" onclick="go(${i})"><span class="num">${complete(i)?'✓':String(i+1).padStart(2,'0')}</span>${t}</button>`).join('');
 $('aside').innerHTML=`<div class="row spread"><span class="eyebrow">WORKSPACE</span><span class="pill">演示</span></div><h3>一条完整的决策链</h3><dl><dt>场景</dt><dd>${esc(s.name)||'等待定义'}</dd><dt>种子数据</dt><dd>${s.seed?esc(s.seed.filename)+' · '+s.seed.rows.length+' 条':'等待上传'}</dd><dt>数据扩增</dt><dd>${s.synth?s.synth.rows+' 条 · '+(s.synth.rows?'模拟重采样':'已跳过'):'等待处理'}</dd><dt>基础模型 / 方法</dt><dd>${s.config?esc(s.config.model)+'<br>'+esc(s.config.method):'等待选择'}</dd><dt>模型版本</dt><dd>${s.training?.status==='done'?'mv_demo_001 · 模拟':'未生成'}</dd></dl><div class="divider"></div><span class="eyebrow">EXECUTION</span><p><span class="status-dot"></span>${esc(s.env)}<br>此原型不占用算力</p><button class="small ghost" onclick="environment()">更换演示环境 ↗</button><div class="divider"></div><p>顶部步骤可自由查看。执行前检查依赖，关闭摘要可专注当前操作。</p>`;
 $('canvas').innerHTML=[sceneView,seedView,synthView,configView,trainingView,evaluationView,exportView][s.step]();renderLogs();bindUpload();
}
function renderLogs(){$('logs').textContent=s.logs.length?s.logs.join('\n'):'尚无活动。开始定义场景，或使用内置示例。';$('logTitle').textContent='⌘ 活动记录 · '+s.logs.length+' 条 · 点击展开';}
function sceneView(){return stageHead(0,'只需要名称和描述。告诉模型要判断什么，种子数据负责给出正确答案。')+`<div class="card hero-card"><div class="hero-orb"></div><div class="stage-icon">✳</div><label class="field"><span>场景名称</span><input id="sceneName" maxlength="100" placeholder="例如：设备质检分级" value="${esc(s.name)}"></label><label class="field"><span>描述你希望模型判断什么</span><textarea id="sceneDescription" maxlength="2000" placeholder="输入有哪些信息？三类结果分别代表什么？">${esc(s.description)}</textarea><small>black / white / gray 可对应你的业务中的不通过 / 通过 / 待复核。</small></label><div class="actions"><button class="primary" onclick="saveScene()">${s.scene?'保存场景并继续':'创建场景，开始准备数据'} →</button><button class="ghost" onclick="fillExample()">填入一个通用示例 ↗</button></div></div><div class="three"><div class="card slim"><span class="eyebrow">01 DEFINE</span><h3 style="margin-top:10px">按你的场景开始</h3><p style="font-size:12px;margin-bottom:0">没有预设业务模板，不需要配置助手。</p></div><div class="card slim"><span class="eyebrow">02 BUILD</span><h3 style="margin-top:10px">七步在同一工作区</h3><p style="font-size:12px;margin-bottom:0">用向导推进，随时回看数据与参数。</p></div><div class="card slim"><span class="eyebrow">03 VERIFY</span><h3 style="margin-top:10px">结果可验证、可交付</h3><p style="font-size:12px;margin-bottom:0">测试数据独立，模型与数据版本关联。</p></div></div>`;}
function fillExample(){$('sceneName').value='设备质检分级';$('sceneDescription').value='根据检测记录中的偏差、温度和表面状态，将设备分为不通过（black）、通过（white）和待复核（gray），并输出简短的判定依据。';}
function invalidate(from){if(from<=1){s.prepared=false;s.synth=null;}if(from<=2)s.config=null;if(from<=3){clearInterval(timer);timer=null;s.training=null;s.evaluated=false;s.serving=false;testResult=null;}}
function saveScene(){const name=$('sceneName').value.trim(),description=$('sceneDescription').value.trim();if(!name||!description){toast('请填写场景名称和描述');return;}const run=()=>{if(s.scene&&(s.name!==name||s.description!==description))invalidate(1);s.name=name;s.description=description;s.scene=true;log('保存场景：'+name);go(1);};if(s.scene&&(s.name!==name||s.description!==description)&&s.prepared)confirmAction('创建新的场景修订','场景语义变化后，下游数据准备、训练与测试需要重新执行。本 Demo 会清除下游模拟结果。',run);else run();}

function csvParse(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell='';}else cell+=c;}if(quoted)throw Error('CSV 引号未闭合');row.push(cell);if(row.some(v=>v.trim()))rows.push(row);if(rows.length<2)throw Error('文件需要表头和至少一条数据');const headers=rows.shift().map(v=>v.replace(/^\uFEFF/,'').trim());if(headers.some(h=>!h)||new Set(headers).size!==headers.length)throw Error('表头不能为空或重复');const aliases={black:'black',white:'white',gray:'gray',grey:'gray','黑':'black','白':'white','灰':'gray'};return rows.map((vals,i)=>{if(vals.length!==headers.length)throw Error('第 '+(i+2)+' 行列数与表头不一致');const r=Object.fromEntries(headers.map((h,j)=>[h,vals[j]]));r.decision=aliases[String(r.decision??r.label??'').trim().toLowerCase()]||'';delete r.label;if(!r.decision)throw Error('第 '+(i+2)+' 行缺少有效三分类标签');return r;});}

function cancelTrain(){clearInterval(timer);timer=null;s.training.status='cancelled';log('模拟任务已取消；可重新开始。');render();}
function evaluationView(){if(s.training?.status!=='done')return blocked('真实产品需要先有可加载模型','本 Demo 先完成训练动画，再体验报告与单条试用。',4);return stageHead(5,'独立测试、错误案例和单条试用，放在同一个验证空间。')+`<div class="card"><div class="row spread"><h3>mv_demo_001 · 测试验证</h3><span class="pill warn">所有指标为预置演示值</span></div><div class="tab-row" style="margin-top:20px"><button class="${reportTab==='overview'?'active':''}" onclick="reportTab='overview';render()">验证报告</button><button class="${reportTab==='try'?'active':''}" onclick="reportTab='try';render()">单条试用</button><button class="${reportTab==='errors'?'active':''}" onclick="reportTab='errors';render()">错误案例</button></div>${reportTab==='overview'?`<div class="note warn">下面的 100 条与指标为报告样式的固定演示数据，不由上传文件或模型测得。不可用于判断模型是否达标。</div><h3>性能优先</h3><div class="metric-grid" style="margin:16px 0 25px"><div class="metric"><small>端到端 P95 · 模拟</small><strong>420 <span>ms</span></strong><span>演示：从请求到完整回答</span></div><div class="metric"><small>峰值内存 · 模拟</small><strong>1.6 <span>GB</span></strong><span>环境口径仅为占位</span></div><div class="metric"><small>成功响应 · 模拟</small><strong>98 <span>/ 100</span></strong><span>2 条格式失败也保留在分母</span></div></div><h3>决策效果</h3><div class="metric-grid" style="margin-top:16px"><div class="metric"><small>整体有效判定率 · 模拟</small><strong>91.0%</strong><span>91 条正确 / 100 条请求</span></div><div class="metric"><small>合规回答条件准确率 · 模拟</small><strong>92.9%</strong><span>91 条正确 / 98 条合规回答</span></div><div class="metric"><small>格式合规率 · 模拟</small><strong>98.0%</strong><span>98 条合规 / 100 条请求</span></div></div><div class="actions"><button class="primary" onclick="finishEvaluation()">确认演示报告，前往交付 →</button><button onclick="reportTab='try';render()">试一条自己的输入</button></div>`:reportTab==='try'?`<p>使用演示规则判定偏差和表面状态，体验输入与结果布局。这里没有模型推理；评分只是界面示意。</p><label class="field"><span>样本输入 · JSON</span><textarea id="testInput" rows="5">${esc(JSON.stringify({deviation:6.2,temperature:78,surface:'明显缺陷'},null,2))}</textarea></label><button class="primary" onclick="trySample()">运行单条演示 ↗</button><div id="testResult">${testResult?resultHtml(testResult):''}</div>`:`<div class="note warn">预置错误案例，不来自你的数据或真实模型。</div><div class="table-scroll"><table><thead><tr><th>案例</th><th>真实标签 · 演示</th><th>预测 · 演示</th><th>问题</th></tr></thead><tbody><tr><td>EXAMPLE-014</td><td>${label('gray')}</td><td>${label('white')}</td><td>复核边界判定偏乐观</td></tr><tr><td>EXAMPLE-037</td><td>${label('white')}</td><td>${label('black')}</td><td>孤立异常引发误判</td></tr><tr><td>EXAMPLE-082</td><td>${label('gray')}</td><td>无有效输出</td><td>格式错误 · 保留在总分母</td></tr></tbody></table></div><p style="font-size:12px;margin-top:17px">正式产品应支持逐条查看输入、原始回答、判定依据与失败原因。</p>`}</div>`;}
function resultHtml(r){return `<div class="result" style="margin-top:20px"><span class="eyebrow">DEMO RULE RESULT</span><h3>${label(r.decision)} · 演示规则结果</h3><p>${esc(r.reason)}</p><div class="code">${esc(JSON.stringify(r,null,2))}</div><small class="muted">score / confidence 为演示常量，未校准，非模型推理。</small></div>`;}
function trySample(){try{const x=JSON.parse($('testInput').value);if(!x||typeof x!=='object'||Array.isArray(x)||!Number.isFinite(Number(x.deviation)))throw Error('请输入对象，并包含数值 deviation');const d=Number(x.deviation);const decision=d>=6?'black':d<3?'white':'gray';testResult={decision,score:decision==='black'?.9:decision==='white'?.1:.5,confidence:.8,reason:'演示规则：偏差 '+d+'，'+(decision==='black'?'达到不通过区间':decision==='white'?'处于合格区间':'处于待复核区间')+'。非模型推理。'};$('testResult').innerHTML=resultHtml(testResult);log('运行单条规则演示；不是模型预测。');renderLogs();}catch(e){$('testResult').innerHTML='<div class="note error" role="alert">'+esc(e.message)+'</div>';}}
function finishEvaluation(){s.evaluated=true;log('确认预置演示报告，进入交付。');go(6);}
function exportView(){if(!s.evaluated)return blocked('先确认测试验证结果','检查报告和单条试用后，再进行交付。',5);return stageHead(6,'下载交付包与启动服务是两个独立动作。工作区备份用于保留实验上下文。')+`<div class="two"><div class="card"><div class="stage-icon">↧</div><h3>导出模型</h3><p>正式模型包：权重、场景、数据谱系、输入输出约定与评测报告。</p><div class="badge-line"><span class="pill">标准压缩</span><span class="pill blue">版本固定</span></div><div class="note warn">Demo 只下载 JSON 交付清单，不含模型权重，不能加载推理。</div><button class="primary" onclick="exportManifest()">下载演示交付清单 ↧</button></div><div class="card"><div class="stage-icon">↗</div><h3>部署预测服务</h3><p>正式产品健康检查与业务请求通过后，才显示服务可调用。</p><div class="badge-line"><span class="pill ${s.serving?'':'warn'}">${s.serving?'● 模拟运行中':'○ 未启动'}</span></div><div class="note">此处只切换演示状态，不启动进程或监听端口。</div><button class="${s.serving?'danger':'primary'}" onclick="toggleService()">${s.serving?'停止服务演示':'启动服务演示 ↗'}</button></div></div>${s.serving?`<div class="card"><div class="row spread"><h3>调用示例 · 无真实服务</h3><button class="small" onclick="copyExample()">复制示例</button></div><pre class="code" id="curl">${esc(curl())}</pre></div>`:''}<div class="card"><div class="row spread"><div><h3>保存整个工作区</h3><p style="margin-bottom:0">导出名称、描述、种子数据、配置与演示记录，可重新导入本 HTML。</p></div><div class="row"><button onclick="exportWorkspace()">下载工作区演示备份</button><button onclick="$('restore').click()">导入演示备份</button></div></div><div class="note warn">真实租赁节点释放前需下载并校验实际工作区备份。此 Demo 的浏览器保存不能代替服务器备份。</div></div>`;}
function download(name,content,type='application/json'){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function downloadSample(){const rows=sampleRows(),keys=Object.keys(rows[0]),quote=v=>'"'+String(v).replace(/"/g,'""')+'"';download('SystemOneStudio-示例种子.csv','\uFEFF'+[keys,...rows.map(r=>keys.map(k=>r[k]))].map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function exportManifest(){download('SystemOneStudio-DEMO-交付清单.json',JSON.stringify({demo:true,contains_model_weights:false,version:'mv_demo_001',scene:{name:s.name,description:s.description},config:s.config,seed_rows:s.seed.rows.length,synth:s.synth,evaluation:'固定演示报告，非实测',expected_real_package:['model-q4.gguf','scene.json','lineage.json','schema.json','evaluation.json','checksums.txt','README.md']},null,2));log('导出演示交付清单；不包含权重。');renderLogs();toast('已下载演示清单');}
function exportWorkspace(){download('SystemOneStudio-DEMO-工作区.json',JSON.stringify({...s,demo:true,serving:false},null,2));toast('已下载演示备份，可在本 HTML 导入');}
function toggleService(){s.serving=!s.serving;log(s.serving?'模拟服务健康检查与示例调用通过；没有真实监听端口。':'服务演示已停止。');render();}
function curl(){return `# 演示地址，无法实际调用\ncurl https://studio.example.invalid/v1/predict \\\n  -H "Content-Type: application/json" \\\n  -d '{"model_version":"mv_demo_001","sample":{"deviation":6.2,"surface":"明显缺陷"}}'`;}
async function copyExample(){try{await navigator.clipboard.writeText(curl());toast('已复制演示调用示例');}catch{toast('浏览器不允许剪贴板访问，请选中文本复制');}}
$('restore').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024)throw Error('备份超过演示大小限制');const x=JSON.parse(await f.text());if(x.schema!==1||x.demo!==true||typeof x.name!=='string'||typeof x.description!=='string'||!Array.isArray(x.logs)||!x.seed||!Array.isArray(x.seed.rows)||!Number.isInteger(x.step)||x.step<0||x.step>6)throw Error('不是有效的本 Demo 工作区备份');confirmAction('导入演示工作区','将替换当前浏览器的演示进度，服务状态会恢复为未启动。',()=>{clearInterval(timer);timer=null;s={...fresh(),...x,serving:false};if(s.training?.status==='running')s.training.status='paused';log('导入演示工作区；服务未启动。');testResult=null;save();render();toast('演示工作区已恢复');});}catch(err){toast('无法导入：'+err.message);}finally{e.target.value='';}};
render();
</script>
</body></html>
